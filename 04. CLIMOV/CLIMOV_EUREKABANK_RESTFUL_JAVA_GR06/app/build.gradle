plugins {
    id 'com.android.application'
}

android {
    namespace 'ec.edu.monster.movil'
    compileSdk 36

    defaultConfig {
        applicationId 'ec.edu.monster.movil.restjava'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// Sin dependencias: solo el SDK de Android (HttpURLConnection + org.json).
